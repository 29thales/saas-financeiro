{% extends "base.html" %}
{% block title %}Contas - FinanceApp{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
    <h4 class="fw-bold mb-0">Contas</h4>
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalConta" onclick="abrirModalNovo()">
        <i class="bi bi-plus-lg me-1"></i>Nova Conta
    </button>
</div>

<div class="row g-3" id="lista-contas"></div>

<!-- Modal Criar/Editar -->
<div class="modal fade" id="modalConta" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modal-titulo">Nova Conta</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <input type="hidden" id="conta-id">
                <div class="mb-3">
                    <label class="form-label">Nome</label>
                    <input type="text" id="conta-nome" class="form-control" placeholder="Ex: Nubank, Itaú...">
                </div>
                <div class="mb-3">
                    <label class="form-label">Tipo</label>
                    <select id="conta-tipo" class="form-select">
                        <option value="credit">Cartão de Crédito</option>
                        <option value="debit">Conta Corrente</option>
                        <option value="cash">Dinheiro</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label">Saldo</label>
                    <input type="number" id="conta-saldo" class="form-control" placeholder="0.00" step="0.01">
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                <button class="btn btn-primary" id="btn-salvar" onclick="salvarConta()">Salvar</button>
            </div>
        </div>
    </div>
</div>

<script>
const tipoLabel = { credit: 'Cartão de Crédito', debit: 'Conta Corrente', cash: 'Dinheiro' };
const tipoIcon  = { credit: 'bi-credit-card', debit: 'bi-bank', cash: 'bi-cash' };
const tipoBg    = { credit: 'var(--accent-light)', debit: '#e8f7ef', cash: '#fdf4e3' };
const tipoColor = { credit: 'var(--accent)', debit: '#1a9e5c', cash: '#e0a90a' };

async function loadContas() {
    const res = await fetch('/accounts/');
    const contas = await res.json();
    const html = contas.map(c => `
        <div class="col-md-4">
            <div class="card p-3">
                <div class="d-flex justify-content-between align-items-start">
                    <div class="d-flex align-items-center gap-2">
                        <div style="width:36px;height:36px;border-radius:10px;background:${tipoBg[c.type]};display:flex;align-items:center;justify-content:center;">
                            <i class="bi ${tipoIcon[c.type]}" style="color:${tipoColor[c.type]};font-size:1.1rem;"></i>
                        </div>
                        <div>
                            <h6 class="fw-bold mb-0">${c.name}</h6>
                            <small class="text-muted">${tipoLabel[c.type]}</small>
                        </div>
                    </div>
                    <div class="d-flex gap-1">
                        <button class="btn btn-sm btn-outline-primary" onclick="abrirModalEditar(${c.id}, '${c.name}', '${c.type}', ${c.balance})">
                            <i class="bi bi-pencil"></i>
                        </button>
                        <button class="btn btn-sm btn-outline-danger" onclick="deletarConta(${c.id})">
                            <i class="bi bi-trash"></i>
                        </button>
                    </div>
                </div>
                <div class="mt-3 pt-3 border-top">
                    <div class="text-muted small">Saldo</div>
                    <div class="fs-5 fw-bold">R$ ${c.balance.toFixed(2)}</div>
                </div>
            </div>
        </div>
    `).join('') || '<div class="col"><p class="text-muted">Nenhuma conta cadastrada.</p></div>';
    document.getElementById('lista-contas').innerHTML = html;
}

function abrirModalNovo() {
    document.getElementById('modal-titulo').textContent = 'Nova Conta';
    document.getElementById('conta-id').value = '';
    document.getElementById('conta-nome').value = '';
    document.getElementById('conta-tipo').value = 'credit';
    document.getElementById('conta-saldo').value = '';
}

function abrirModalEditar(id, nome, tipo, saldo) {
    document.getElementById('modal-titulo').textContent = 'Editar Conta';
    document.getElementById('conta-id').value = id;
    document.getElementById('conta-nome').value = nome;
    document.getElementById('conta-tipo').value = tipo;
    document.getElementById('conta-saldo').value = saldo;
    new bootstrap.Modal(document.getElementById('modalConta')).show();
}

async function salvarConta() {
    const id = document.getElementById('conta-id').value;
    const body = {
        name: document.getElementById('conta-nome').value,
        type: document.getElementById('conta-tipo').value,
        balance: parseFloat(document.getElementById('conta-saldo').value) || 0
    };

    const url = id ? `/accounts/${id}` : '/accounts/';
    const method = id ? 'PUT' : 'POST';

    const res = await fetch(url, {
        method,
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify(body)
    });

    if (res.ok) {
        bootstrap.Modal.getInstance(document.getElementById('modalConta')).hide();
        loadContas();
    }
}

async function deletarConta(id) {
    if (!confirm('Deletar esta conta?')) return;
    await fetch(`/accounts/${id}`, { method: 'DELETE' });
    loadContas();
}

loadContas();
</script>
{% endblock %}
