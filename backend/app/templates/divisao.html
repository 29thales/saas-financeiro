{% extends "base.html" %}
{% block title %}Divisão - FinanceApp{% endblock %}
{% block content %}
<h4 class="fw-bold mb-4">Divisão de Despesas</h4>
<div class="row g-3 mb-4">
    <div class="col-md-4">
        <div class="card p-3">
            <div class="d-flex align-items-center gap-2 mb-2">
                <div style="width:32px;height:32px;border-radius:9px;background:#e8f7ef;display:flex;align-items:center;justify-content:center;">
                    <i class="bi bi-arrow-down-circle" style="color:#1a9e5c;"></i>
                </div>
                <div class="text-muted small">Me Devem</div>
            </div>
            <div class="fs-4 fw-bold" id="owed-to-me">R$ --</div>
        </div>
    </div>
    <div class="col-md-4">
        <div class="card p-3">
            <div class="d-flex align-items-center gap-2 mb-2">
                <div style="width:32px;height:32px;border-radius:9px;background:#fdeeee;display:flex;align-items:center;justify-content:center;">
                    <i class="bi bi-arrow-up-circle" style="color:#d64545;"></i>
                </div>
                <div class="text-muted small">Eu Devo</div>
            </div>
            <div class="fs-4 fw-bold" id="i-owe">R$ --</div>
        </div>
    </div>
</div>
<div class="row g-3">
    <div class="col-md-6">
        <div class="card p-3">
            <h6 class="fw-bold mb-3">Dividir Despesa</h6>
            <div class="mb-3">
                <label class="form-label">Despesa</label>
                <select id="split-despesa" class="form-select"></select>
            </div>
            <div class="mb-3">
                <label class="form-label">Participantes (separados por vírgula)</label>
                <input type="text" id="split-users" class="form-control" placeholder="admin, joao, maria">
            </div>
            <button class="btn btn-primary w-100" onclick="dividir()">Dividir</button>
            <div id="split-result" class="mt-3"></div>
        </div>
    </div>
    <div class="col-md-6">
        <div class="card p-3">
            <h6 class="fw-bold mb-3">Quem Me Deve</h6>
            <div id="lista-owed-to-me"></div>
        </div>
    </div>
</div>
<script>
async function loadSaldos() {
    const res = await fetch('/splits/balances');
    const bal = await res.json();
    document.getElementById('owed-to-me').textContent = `R$ ${bal.total_owed_to_me.toFixed(2)}`;
    document.getElementById('i-owe').textContent = `R$ ${bal.total_i_owe.toFixed(2)}`;
    document.getElementById('lista-owed-to-me').innerHTML = bal.owed_to_me.length
        ? bal.owed_to_me.map(s => `
            <div class="d-flex justify-content-between align-items-center py-2 border-bottom">
                <div>
                    <div class="fw-semibold">${s.username}</div>
                    <small class="text-muted">Despesa #${s.expense_id}</small>
                </div>
                <span class="text-warning fw-bold">R$ ${s.amount.toFixed(2)}</span>
            </div>
        `).join('')
        : '<p class="text-muted">Ninguém te deve no momento.</p>';
}
async function loadDespesas() {
    const res = await fetch('/expenses/');
    const despesas = await res.json();
    document.getElementById('split-despesa').innerHTML = despesas
        .map(d => `<option value="${d.id}">${d.description} - R$ ${d.amount.toFixed(2)}</option>`)
        .join('');
}
async function dividir() {
    const expenseId = document.getElementById('split-despesa').value;
    const users = document.getElementById('split-users').value.split(',').map(u => u.trim()).filter(Boolean);
    const res = await fetch(`/splits/${expenseId}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ participants: users })
    });
    const data = await res.json();
    document.getElementById('split-result').innerHTML = res.ok
        ? `<div class="alert alert-success">${data.message} — R$ ${data.amount_per_person.toFixed(2)} cada</div>`
        : `<div class="alert alert-danger">${data.error}</div>`;
    if (res.ok) loadSaldos();
}
loadSaldos();
loadDespesas();
</script>
{% endblock %}
