<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FinanceApp{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --accent: #2f5fd8;
            --accent-light: #eef2fd;
            --text-main: #1b1f2a;
            --text-muted: #6b7280;
            --border-soft: #e8eaf0;
        }
        body { background-color: #f4f6fb; color: var(--text-main); }

        /* SIDEBAR DESKTOP */
        .sidebar {
            min-height: 100vh;
            background: #ffffff;
            border-right: 1px solid var(--border-soft);
            width: 250px;
            position: fixed;
            top: 0; left: 0;
            padding: 20px 0;
            z-index: 100;
            transition: transform 0.3s ease;
        }
        .sidebar .nav-link {
            color: var(--text-muted);
            padding: 10px 16px;
            border-radius: 10px;
            margin: 2px 12px;
            font-size: 0.92rem;
            font-weight: 500;
            transition: all 0.15s;
        }
        .sidebar .nav-link:hover {
            background-color: #f4f6fb;
            color: var(--text-main);
        }
        .sidebar .nav-link.active {
            background-color: var(--accent-light);
            color: var(--accent);
        }
        .sidebar .brand {
            color: var(--text-main);
            font-size: 1.15rem;
            font-weight: 700;
            padding: 8px 20px 24px;
            display: flex;
            align-items: center;
            text-decoration: none;
        }
        .sidebar .brand .brand-icon {
            width: 32px;
            height: 32px;
            background: var(--accent);
            color: #fff;
            border-radius: 9px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 10px;
            font-size: 1rem;
        }
        .sidebar hr { border-color: var(--border-soft); }
        .sidebar .nav-link.text-danger:hover { background-color: #fdeeee; }

        .main-content {
            margin-left: 250px;
            padding: 30px;
        }

        /* TOPBAR MOBILE */
        .topbar {
            display: none;
            background: #ffffff;
            border-bottom: 1px solid var(--border-soft);
            padding: 12px 16px;
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 200;
            align-items: center;
            justify-content: space-between;
        }
        .topbar .brand {
            color: var(--text-main);
            font-size: 1.05rem;
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
        }
        .topbar .brand .brand-icon {
            width: 28px;
            height: 28px;
            background: var(--accent);
            color: #fff;
            border-radius: 8px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-right: 8px;
            font-size: 0.9rem;
        }
        .topbar .btn-menu {
            background: none;
            border: none;
            color: var(--text-main);
            font-size: 1.5rem;
            cursor: pointer;
        }

        /* OVERLAY MOBILE */
        .sidebar-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.4);
            z-index: 150;
        }

        .card { border: 1px solid var(--border-soft); border-radius: 14px; box-shadow: 0 1px 3px rgba(16,24,40,0.04); }
        .stat-card { border-left: 4px solid; }
        .stat-card.green { border-color: #1a9e5c; }
        .stat-card.red { border-color: #d64545; }
        .stat-card.blue { border-color: var(--accent); }
        .stat-card.yellow { border-color: #e0a90a; }

        .btn-primary { background-color: var(--accent); border-color: var(--accent); }
        .btn-primary:hover { background-color: #2450b8; border-color: #2450b8; }
        .btn-outline-primary { color: var(--accent); border-color: var(--accent); }
        .btn-outline-primary:hover { background-color: var(--accent); border-color: var(--accent); }

        /* MOBILE */
        @media (max-width: 768px) {
            .sidebar {
                transform: translateX(-100%);
                z-index: 300;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .sidebar-overlay.open {
                display: block;
            }
            .topbar {
                display: flex;
            }
            .main-content {
                margin-left: 0;
                padding: 80px 15px 20px;
            }
            .fs-4, .fs-5 {
                font-size: 1rem !important;
            }
            .fs-2, .fs-3 {
                font-size: 1.3rem !important;
            }
        }
    </style>
</head>
<body>
    {% if current_user.is_authenticated %}

    <!-- TOPBAR MOBILE -->
    <div class="topbar">
        <a class="brand" href="/dashboard"><span class="brand-icon"><i class="bi bi-wallet2"></i></span>FinanceApp</a>
        <button class="btn-menu" onclick="toggleSidebar()">
            <i class="bi bi-list"></i>
        </button>
    </div>

    <!-- OVERLAY -->
    <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

    <!-- SIDEBAR -->
    <div class="sidebar" id="sidebar">
        <a class="brand" href="/dashboard"><span class="brand-icon"><i class="bi bi-wallet2"></i></span>FinanceApp</a>
        <nav class="nav flex-column">
            <a class="nav-link {% if request.path == '/dashboard' %}active{% endif %}" href="/dashboard" onclick="closeSidebar()">
                <i class="bi bi-speedometer2 me-2"></i>Dashboard
            </a>
            <a class="nav-link {% if '/contas' in request.path %}active{% endif %}" href="/contas" onclick="closeSidebar()">
                <i class="bi bi-bank me-2"></i>Contas
            </a>
            <a class="nav-link {% if '/despesas' in request.path %}active{% endif %}" href="/despesas" onclick="closeSidebar()">
                <i class="bi bi-receipt me-2"></i>Despesas
            </a>
            <a class="nav-link {% if '/gastos-diarios' in request.path %}active{% endif %}" href="/gastos-diarios" onclick="closeSidebar()">
                <i class="bi bi-cup-hot me-2"></i>Gastos Diários
            </a>
            <a class="nav-link {% if '/divisao' in request.path %}active{% endif %}" href="/divisao" onclick="closeSidebar()">
                <i class="bi bi-people me-2"></i>Divisão
            </a>
            <a class="nav-link {% if '/relatorios' in request.path %}active{% endif %}" href="/relatorios" onclick="closeSidebar()">
                <i class="bi bi-bar-chart me-2"></i>Relatórios
            </a>
            <a class="nav-link {% if '/balanco' in request.path %}active{% endif %}" href="/balanco" onclick="closeSidebar()">
                <i class="bi bi-calculator me-2"></i>Balanço
            </a>
            <a class="nav-link {% if '/admin' in request.path %}active{% endif %}" href="/admin" onclick="closeSidebar()">
                <i class="bi bi-shield-lock me-2"></i>Administração
            </a>
            <a class="nav-link {% if '/configuracoes' in request.path %}active{% endif %}" href="/configuracoes" onclick="closeSidebar()">
                <i class="bi bi-gear me-2"></i>Configurações
            </a>
            <hr style="margin: 10px 20px;">
            <a class="nav-link text-danger" href="/auth/logout-page">
                <i class="bi bi-box-arrow-right me-2"></i>Sair
            </a>
        </nav>
    </div>
    {% endif %}

    <div class="{% if current_user.is_authenticated %}main-content{% endif %}">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }
        function closeSidebar() {
            document.getElementById('sidebar').classList.remove('open');
            document.getElementById('overlay').classList.remove('open');
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
